# SmolVLA policy evaluation configuration.
# SmolVLA uses a 16-dim state: [ee_pos(3) + ee_quat(4) + joint_pos(9)], state_start_idx=0.
#
# checkpoint and dataset stats must be overridden with verified sources.
# Dataset stats can come from a Hub dataset repo or a local LeRobot dataset root.
# Hub example: policy.dataset_stats_repo=your-hf-user-or-org/dataset-repo
# Local example: policy.dataset_stats_root=path/to/lerobot-dataset

policy:
  type: smolvla
  checkpoint: ""  # Required: override with a verified Hub repo ID or local checkpoint path.
  dataset_stats_repo: ""  # Required: override this or dataset_stats_root.
  dataset_stats_root: ""  # Required alternative: local dataset root with meta/stats.json.
  state_start_idx: 0
  state_dim: 16
  action_dim: 8
  infer_type: "guide"
  guide_cam: true

eval:
  query_freq: 10
  eval_steps: 100
  num_episodes: 1
  fps: 10
  save_video: true
  video_dir: "./outputs/videos/smolvla"
  results_dir: "./outputs/results/smolvla"
